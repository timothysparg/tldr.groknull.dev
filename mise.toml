min_version = "2026.9.14"  # .mise/conf.d/ folder fragments
monorepo_root = true

[settings]
lockfile = true
experimental = true

[monorepo]
config_roots = ["modules/ROOT/pages/posts/*"]

[env]
ASSETS_DIR = "{{config_root}}/modules/ROOT/assets"

[tools]
node = "lts"
"npm:antora" = "latest"
"npm:live-server" = "latest"
watchexec = "latest"

[tasks.build]
run = "antora --fetch antora-playbook.yml"
sources = ["antora-playbook.yml", "antora.yml", "posts-extension.js", "modules/**/*"]
outputs = ["public/**"]

[tasks.serve]
run = "live-server public --port=5959 --no-browser"

[tasks.watch-build]
run = "mise watch build"

[tasks.dev]
description = "Watch for changes, rebuild, and serve the site"
run = [
  { tasks = ["serve", "watch-build"] }
]

# The vhs:record task template for screen recordings lives in .mise/conf.d/vhs/
