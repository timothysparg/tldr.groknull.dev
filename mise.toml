min_version = "2026.9.14"  # .mise/conf.d/ folder fragments
monorepo_root = true

[settings]
lockfile = true
experimental = true

[monorepo]
config_roots = ["modules/ROOT/pages/posts/*"]

[env]
ASSETS_DIR = "{{config_root}}/modules/ROOT/assets"

[tools]
node = "lts"
"npm:live-server" = "latest"
watchexec = "latest"

[tasks.build]
description = "Build the site into public/, failing on Antora warnings"
# --fetch refreshes the snapshot UI bundle; .ui-bundle.stamp and the extension files
# change when sync-ui pulls a new UI release, so a UI-only update still rebuilds
# npx --no-install runs the Antora pinned in package-lock.json, never a global install
run = "npx --no-install antora --fetch --log-failure-level=warn antora-playbook.yml"
sources = [
  "antora-playbook.yml",
  "antora.yml",
  "posts-extension.js",
  "antora-tldr-ui.js",
  "asciidoc-tldr-ui.js",
  ".ui-bundle.stamp",
  "modules/**/*",
]
outputs = ["public/**"]

[tasks.clean]
description = "Remove the built site so the next build starts fresh"
run = "rm -rf public"

[tasks.serve]
description = "Serve public/ on port 5959 with live reload"
run = "live-server public --port=5959 --no-browser"

[tasks.watch-build]
description = "Rebuild the site whenever its sources change"
run = "mise watch build"

[tasks.dev]
description = "Sync the UI, then watch for changes, rebuild, and serve the site"
depends = ["sync-ui"]
run = [
  { tasks = ["serve", "watch-build"] }
]

# The vhs:record task template for screen recordings lives in .mise/conf.d/vhs/
